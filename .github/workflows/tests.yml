name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Установить зависимости
        run: pip install -r requirements.txt
      - name: Показать поддержанные форматы
        run: python docs2md.py --list-formats
      - name: Автотесты
        run: python tests/test_docs2md.py
